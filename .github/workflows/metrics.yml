name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Se ejecuta automáticamente cada medianoche
  workflow_dispatch: # Te permite ejecutarlo manualmente cuando quieras
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, repositories

          commits_authoring: GerardoAJF, Gerardoowo, 74077723+GerardoAJF@users.noreply.github.com

          repositories_affiliations: owner, collaborator
          
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 15
